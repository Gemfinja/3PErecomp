plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thirdbirthday.recomp'
    compileSdk 34

    defaultConfig {
        applicationId "com.thirdbirthday.recomp"
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName "0.9.16"

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DCMAKE_BUILD_TYPE=Release"
                targets "SDL3-shared", "game", "main", "main_hook", "file_redirect_hook", "gsl_alloc_hook", "hook_impl"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../third_party/SDL3/android-project/app/src/main/java']
        }
    }

    androidResources {
        noCompress 'bin', 'iso'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
}
